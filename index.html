<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Business School Amanat — Договор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #c8a96e;
  --gold-light: #e0c99a;
  --bg: #0b0b0b;
  --card: #141414;
  --border: #222;
  --text: #ede8dc;
  --muted: rgba(237,232,220,0.4);
  --red: #d96060;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding: 36px 16px 60px;
}

.wrap { max-width: 820px; margin: auto; }

/* ── LOGO ── */
.logo {
  text-align: center;
  margin-bottom: 40px;
  padding-top: 8px;
}
.logo-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: .06em;
}
.logo-sub {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
}
.logo-line {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin: 14px auto 0;
  opacity: .4;
}

/* ── CARD ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: .5;
}

.step-badge {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: .7;
  margin-bottom: 20px;
}
.card h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--gold-light);
  margin-bottom: 24px;
  letter-spacing: .04em;
}

/* ── FORM ── */
label {
  display: block;
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.req { color: var(--gold); opacity: 1; }

input, select {
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0d0d0d;
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 20px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(200,169,110,.08);
}
select option { background: #141414; }

/* ── BUTTONS ── */
.btn {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: .06em;
  text-transform: uppercase;
  transition: opacity .2s, transform .12s;
  margin-bottom: 8px;
}
.btn:hover { opacity: .82; }
.btn:active { transform: scale(.975); }
.btn-gold { background: var(--gold); color: #0b0b0b; font-weight: 600; }
.btn-ghost { background: transparent; border: 1px solid #2e2e2e; }

.error-msg { color: var(--red); font-size: 12px; margin-bottom: 14px; min-height: 16px; }

/* ── CONTRACT VIEW ── */
.contract-view {
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 30px 26px;
  font-family: 'Jost', sans-serif;
  font-size: 11.5px;
  line-height: 1.9;
  margin-bottom: 22px;
  max-height: 68vh;
  overflow-y: auto;
  border: 1px solid #ddd;
}
.contract-view h2 {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 3px;
  color: #000;
  letter-spacing: .04em;
}
.contract-view .sub {
  text-align: center;
  font-size: 9.5px;
  color: #999;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.ct-cols { display: flex; gap: 22px; margin-bottom: 12px; }
.ct-col {
  flex: 1; min-width: 0;
  border-left: 3px solid #c8a96e;
  padding-left: 11px;
}
@media (max-width: 580px) { .ct-cols { flex-direction: column; } }
.ct-col-head {
  font-size: 9px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: #888;
  border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 9px;
}
.ct-section-title {
  font-size: 11.5px; font-weight: 700; color: #000;
  margin: 14px 0 5px; letter-spacing: .02em;
}
.ct-p { margin-bottom: 5px; color: #222; }
.ct-bilingual { margin-top: 4px; }
.ct-bil-head { display: flex; gap: 16px; margin-bottom: 6px; }
.ct-bil-head span { flex: 1; font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c8a96e; border-bottom: 1px solid #c8a96e; padding-bottom: 3px; }
.ct-bil-row { display: flex; gap: 16px; margin-bottom: 8px; }
.ct-bil-col { flex: 1; min-width: 0; font-size: 10.5px; line-height: 1.75; color: #222; border-left: 2px solid #e8e0d0; padding-left: 8px; }
@media (max-width: 500px) { .ct-bil-row { flex-direction: column; } .ct-bil-head { flex-direction: column; gap: 4px; } }
.ct-hr { border: none; border-top: 1px solid #e4e4e4; margin: 14px 0; }
.ct-info-row { display: flex; gap: 8px; margin-bottom: 3px; }
.ct-info-label { color: #888; min-width: 95px; }
.ct-info-val { font-weight: 600; color: #000; }
.ct-parties {
  background: #f9f7f2; border-radius: 8px;
  padding: 12px 16px; margin-bottom: 14px;
  border: 1px solid #e8e0d0;
}
.ct-notice {
  background: #fff8ed; border-left: 3px solid #c8a96e;
  padding: 8px 12px; border-radius: 0 6px 6px 0;
  margin: 10px 0; font-size: 11px; color: #555;
}

/* ── SIGNATURE ── */
.sign-hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.canvas-wrap {
  position: relative;
  background: #fff;
  border: 2px dashed #2e2e2e;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 18px;
  cursor: crosshair;
  transition: border-color .2s;
}
.canvas-wrap:hover { border-color: var(--gold); }
#sigCanvas {
  display: block; width: 100%; height: 190px;
  touch-action: none; cursor: crosshair;
}
.canvas-placeholder {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px; opacity: .28;
  pointer-events: none; user-select: none;
}

.sign-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sign-actions .btn { flex: 1; min-width: 110px; margin-bottom: 0; }
.contract-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.contract-actions .btn { flex: 1; min-width: 130px; margin-bottom: 0; }

/* ── DONE ── */
.done-wrap { text-align: center; padding: 40px 20px; }
.done-icon { font-size: 56px; margin-bottom: 14px; }
.done-title {
  font-family: 'Cormorant Garamond', serif;
  color: var(--gold); font-size: 26px; margin-bottom: 8px;
}
.done-sub { opacity: .5; font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-title">Business School Amanat</div>
    <div class="logo-sub">Договор об оказании услуг · Қызмет көрсету шарты</div>
    <div class="logo-line"></div>
  </div>

  <!-- ШАГ 1: ФОРМА -->
  <div class="card" id="stepForm">
    <div class="step-badge">Шаг 1 из 3 — Ваши данные</div>
    <h3>Данные заказчика</h3>

    <label>ФИО / Т.А.Ә. <span class="req">*</span></label>
    <input id="fio" placeholder="Иванов Иван Иванович" autocomplete="name">

    <label>ИИН / ЖСН <span class="req">*</span></label>
    <input id="iin" placeholder="000000000000" maxlength="12" inputmode="numeric">


    <label>Адрес / Мекенжай</label>
    <input id="address" placeholder="г. Алматы, ул. ...">

    <label>Телефон</label>
    <input id="phone" placeholder="+7 (___) ___-__-__" inputmode="tel">

    <label>Email</label>
    <input id="email" placeholder="email@example.com" inputmode="email">

    <label>Стоимость услуг / Қызмет құны <span class="req">*</span></label>
    <select id="amount">
      <option value="135 000 тенге">135 000 тенге</option>
      <option value="200 000 тенге">200 000 тенге</option>
      <option value="400 000 тенге">400 000 тенге</option>
    </select>

    <div id="formError" class="error-msg"></div>
    <button class="btn btn-gold" onclick="goToContract()">Продолжить — читать договор →</button>
  </div>

  <!-- ШАГ 2: ПРОСМОТР ДОГОВОРА -->
  <div class="card" id="stepContract" style="display:none">
    <div class="step-badge">Шаг 2 из 3 — Ознакомьтесь с договором</div>
    <div class="contract-view" id="contractView"></div>
    <div class="contract-actions">
      <button class="btn btn-ghost" onclick="goBack()">← Изменить данные</button>
      <button class="btn" onclick="goToSign()">Перейти к подписи →</button>
    </div>
  </div>

  <!-- ШАГ 3: ПОДПИСЬ -->
  <div class="card" id="stepSign" style="display:none">
    <div class="step-badge">Шаг 3 из 3 — Подпись</div>
    <p class="sign-hint">Распишитесь в поле ниже пальцем или мышью</p>
    <div class="canvas-wrap">
      <canvas id="sigCanvas"></canvas>
      <div class="canvas-placeholder" id="canvasPlaceholder">✍️ Нарисуйте подпись здесь</div>
    </div>
    <div id="signError" class="error-msg"></div>
    <div class="sign-actions">
      <button class="btn btn-ghost" onclick="clearSig()">✕ Очистить</button>
      <button class="btn btn-ghost" onclick="goToContract()">← Назад</button>
      <button class="btn btn-gold" onclick="generatePDF()">✓ Подписать и скачать PDF</button>
    </div>
  </div>

  <!-- ГОТОВО -->
  <div class="card" id="stepDone" style="display:none">
    <div class="done-wrap">
      <div class="done-icon">✅</div>
      <div class="done-title">Договор подписан!</div>
      <div class="done-sub">PDF сохранён на ваше устройство</div>
      <button class="btn btn-ghost" onclick="restart()" style="max-width:220px;margin:auto">Новый договор</button>
    </div>
  </div>

</div>

<!-- html2canvas + jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
// ─── STATE ───────────────────────────────────────────────
let formData = {};
let sigInitialized = false;
let drawing = false;
let sigCtx = null;   // исправлено: НЕ обращаемся к canvas при загрузке страницы

// ─── STEP 1 → 2: SHOW CONTRACT ───────────────────────────
function goToContract() {
  const fio      = document.getElementById('fio').value.trim();
  const iin      = document.getElementById('iin').value.trim();
  const passport = '';
  const address  = document.getElementById('address').value.trim();
  const phone    = document.getElementById('phone').value.trim();
  const email    = document.getElementById('email').value.trim();
  const amount   = document.getElementById('amount').value;

  const errEl = document.getElementById('formError');
  if (!fio)  { errEl.textContent = 'Введите ФИО / Т.А.Ә.'; return; }
  if (!iin || iin.length < 12 || !/^\d+$/.test(iin)) {
    errEl.textContent = 'Введите корректный ИИН — 12 цифр / ЖСН';
    return;
  }
  errEl.textContent = '';

  formData = { fio, iin, passport, address, phone, email, amount };

  const today = new Date().toLocaleDateString('ru-RU');
  document.getElementById('contractView').innerHTML = buildContractHTML(formData, today);

  document.getElementById('stepForm').style.display     = 'none';
  document.getElementById('stepContract').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── STEP 2 → 1: BACK ────────────────────────────────────
function goBack() {
  document.getElementById('stepContract').style.display = 'none';
  document.getElementById('stepForm').style.display     = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── STEP 2 → 3: SIGN ────────────────────────────────────
function goToSign() {
  document.getElementById('stepContract').style.display = 'none';
  document.getElementById('stepSign').style.display     = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Инициализируем canvas ТОЛЬКО когда он уже виден в DOM
  requestAnimationFrame(() => requestAnimationFrame(() => {
    sigInitialized = false;
    initSig();
  }));
}

// ─── BUILD CONTRACT HTML (для предпросмотра) ──────────────
function buildContractHTML(d, date) {
  const contractNo = 'BSA-' + d.iin.slice(-4) + '-' + new Date().getFullYear();

  return `
    <h2>ДОГОВОР ОБ ОКАЗАНИИ УСЛУГ / ҚЫЗМЕТ КӨРСЕТУ ШАРТЫ</h2>
    <div class="sub">Business School Amanat · № ${contractNo} · ${date}</div>

    <div class="ct-parties">
      <div class="ct-cols">
        <div class="ct-col">
          <div class="ct-col-head">Русский</div>
          <div class="ct-info-row"><span class="ct-info-label">Исполнитель:</span><span class="ct-info-val">ИП Business School Amanat</span></div>
          <div class="ct-info-row"><span class="ct-info-label">БИН:</span><span class="ct-info-val">010512501511</span></div>
          <div class="ct-info-row"><span class="ct-info-label">Заказчик:</span><span class="ct-info-val">${d.fio}</span></div>
          <div class="ct-info-row"><span class="ct-info-label">ИИН:</span><span class="ct-info-val">${d.iin}</span></div>
          ${d.passport ? `<div class="ct-info-row"><span class="ct-info-label">Паспорт:</span><span class="ct-info-val">${d.passport}</span></div>` : ''}
          ${d.address  ? `<div class="ct-info-row"><span class="ct-info-label">Адрес:</span><span class="ct-info-val">${d.address}</span></div>` : ''}
          ${d.phone    ? `<div class="ct-info-row"><span class="ct-info-label">Телефон:</span><span class="ct-info-val">${d.phone}</span></div>` : ''}
          ${d.email    ? `<div class="ct-info-row"><span class="ct-info-label">Email:</span><span class="ct-info-val">${d.email}</span></div>` : ''}
          <div class="ct-info-row"><span class="ct-info-label">Стоимость:</span><span class="ct-info-val">${d.amount}</span></div>
        </div>
        <div class="ct-col">
          <div class="ct-col-head">Қазақша</div>
          <div class="ct-info-row"><span class="ct-info-label">Орындаушы:</span><span class="ct-info-val">ИП Business School Amanat</span></div>
          <div class="ct-info-row"><span class="ct-info-label">БСН:</span><span class="ct-info-val">010512501511</span></div>
          <div class="ct-info-row"><span class="ct-info-label">Тапсырыс беруші:</span><span class="ct-info-val">${d.fio}</span></div>
          <div class="ct-info-row"><span class="ct-info-label">ЖСН:</span><span class="ct-info-val">${d.iin}</span></div>
          ${d.passport ? `<div class="ct-info-row"><span class="ct-info-label">Төлқұжат:</span><span class="ct-info-val">${d.passport}</span></div>` : ''}
          ${d.address  ? `<div class="ct-info-row"><span class="ct-info-label">Мекенжай:</span><span class="ct-info-val">${d.address}</span></div>` : ''}
          ${d.phone    ? `<div class="ct-info-row"><span class="ct-info-label">Телефон:</span><span class="ct-info-val">${d.phone}</span></div>` : ''}
          ${d.email    ? `<div class="ct-info-row"><span class="ct-info-label">Email:</span><span class="ct-info-val">${d.email}</span></div>` : ''}
          <div class="ct-info-row"><span class="ct-info-label">Сомасы:</span><span class="ct-info-val">${d.amount}</span></div>
        </div>
      </div>
    </div>

    <hr class="ct-hr">

    <div class="ct-bilingual">
      <div class="ct-bil-head"><span>Русский</span><span>Қазақша</span></div>

      <div class="ct-section-title">1. Предмет Договора / Шарттың мәні</div>
      <div class="ct-bil-row">
        <div class="ct-bil-col">1.1. Исполнитель обязуется предоставить: образовательные услуги по товарному бизнесу (теория + практика); доступ в закрытый Telegram-канал с товарами («Жабық чат»); услугу фулфилмента (по отдельному согласованию).<br>1.2. Заказчик обязуется принять и оплатить услуги.</div>
        <div class="ct-bil-col">1.1. Орындаушы міндеттенеді: тауарлық бизнес бойынша білім беру (теория + практика); жабық Telegram-каналға қолжетімділік («Жабық чат»); фулфилмент қызметі (жеке келісім бойынша).<br>1.2. Тапсырыс беруші қызметті қабылдайды және төлеуге міндеттенеді.</div>
      </div>

      <div class="ct-section-title">2. Программа обучения / Оқу бағдарламасы</div>
      <div class="ct-bil-row">
        <div class="ct-bil-col">2.1. Программа включает: Kaspi Магазин, Wildberries, Ozon, eBay, Shopify; поставщики из Китая, Турции, США; доступ к закрытому каналу с товарами; чек-листы, шаблоны, инструкции; консультации преподавателей.<br>2.2. Исполнитель вправе корректировать программу, уведомив Заказчика.</div>
        <div class="ct-bil-col">2.1. Бағдарлама: Kaspi дүкен, Wildberries, Ozon, eBay, Shopify; Қытай, Түркия, АҚШ жеткізушілері; жабық каналға қолжетімділік; чек-листер, үлгілер, нұсқаулықтар; оқытушы кеңестері.<br>2.2. Орындаушы бағдарламаны алдын ала хабарлай отырып өзгерте алады.</div>
      </div>

      <div class="ct-section-title">3. Порядок оказания услуг / Қызмет тәртібі</div>
      <div class="ct-bil-row">
        <div class="ct-bil-col">3.1. Обучение — дистанционно (онлайн): видеолекции, материалы, задания.<br>3.2. Доступ к каналу — с момента оплаты до конца обучения.<br>3.3. Активация — не позднее 5 рабочих дней после оплаты.<br>3.4. Заказчик отвечает за корректность своих данных.</div>
        <div class="ct-bil-col">3.1. Оқу — қашықтықтан (онлайн): бейне дәрістер, материалдар, тапсырмалар.<br>3.2. Каналға қолжетімділік — төлемнен оқу аяқталғанға дейін.<br>3.3. Белсендіру — төлемнен кейін 5 жұмыс күні ішінде.<br>3.4. Тапсырыс беруші деректерінің дұрыстығына жауапты.</div>
      </div>

      <div class="ct-section-title">4. Стоимость и оплата / Төлем тәртібі — ${d.amount}</div>
      <div class="ct-bil-row">
        <div class="ct-bil-col">4.1. Стоимость: <strong>${d.amount}</strong>.<br>4.2. Оплата 100% до начала услуг.<br>4.3. Способы: Kaspi QR или Kaspi Red (рассрочка).<br>4.4. Оплата считается исполненной с момента поступления средств на счёт.</div>
        <div class="ct-bil-col">4.1. Құны: <strong>${d.amount}</strong>.<br>4.2. Төлем — қызмет басталғанға дейін 100%.<br>4.3. Тәсілдер: Kaspi QR немесе Kaspi Red (бөліп төлеу).<br>4.4. Төлем орындаушы шотына түскен сәттен орындалған деп саналады.</div>
      </div>

// ─── SIGNATURE ───────────────────────────────────────────
// ИСПРАВЛЕНО: canvas и ctx НЕ читаются при загрузке страницы
function getSigCanvas() { return document.getElementById('sigCanvas'); }

function initSig() {
  if (sigInitialized) return;
  const canvas = getSigCanvas();
  const rect   = canvas.getBoundingClientRect();
  if (rect.width === 0) return;
  const r = window.devicePixelRatio || 1;
  canvas.width  = rect.width  * r;
  canvas.height = rect.height * r;
  sigCtx = canvas.getContext('2d');
  sigCtx.setTransform(1, 0, 0, 1, 0, 0);
  sigCtx.scale(r, r);
  sigCtx.lineWidth   = 2.5;
  sigCtx.lineCap     = 'round';
  sigCtx.lineJoin    = 'round';
  sigCtx.strokeStyle = '#111';
  sigInitialized = true;
}

function getPos(e) {
  const canvas = getSigCanvas();
  const rect   = canvas.getBoundingClientRect();
  const src    = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function onSigStart(e) {
  initSig();
  if (!sigCtx) return;
  drawing = true;
  document.getElementById('canvasPlaceholder').style.display = 'none';
  const p = getPos(e);
  sigCtx.beginPath();
  sigCtx.moveTo(p.x, p.y);
}
function onSigMove(e) {
  if (!drawing || !sigCtx) return;
  if (e.cancelable) e.preventDefault();
  const p = getPos(e);
  sigCtx.lineTo(p.x, p.y);
  sigCtx.stroke();
}
function onSigEnd() { drawing = false; }

// ИСПРАВЛЕНО: listeners навешиваются через функцию, вызываемую при открытии шага
function bindSigListeners() {
  const canvas = getSigCanvas();
  canvas.removeEventListener('mousedown',  onSigStart);
  canvas.removeEventListener('touchstart', onSigStart);
  canvas.removeEventListener('mousemove',  onSigMove);
  canvas.removeEventListener('touchmove',  onSigMove);
  canvas.removeEventListener('mouseup',    onSigEnd);
  canvas.removeEventListener('mouseleave', onSigEnd);
  canvas.removeEventListener('touchend',   onSigEnd);

  canvas.addEventListener('mousedown',  onSigStart);
  canvas.addEventListener('touchstart', onSigStart, { passive: false }); // ИСПРАВЛЕНО: passive:false везде
  canvas.addEventListener('mousemove',  onSigMove);
  canvas.addEventListener('touchmove',  onSigMove,  { passive: false });
  canvas.addEventListener('mouseup',    onSigEnd);
  canvas.addEventListener('mouseleave', onSigEnd);
  canvas.addEventListener('touchend',   onSigEnd);
}

// Перепишем goToSign чтобы он вызывал bindSigListeners
function goToSign() {
  document.getElementById('stepContract').style.display = 'none';
  document.getElementById('stepSign').style.display     = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    sigInitialized = false;
    sigCtx = null;
    bindSigListeners();
    initSig();
  }));
}

function clearSig() {
  if (!sigInitialized || !sigCtx) return;
  const canvas = getSigCanvas();
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('canvasPlaceholder').style.display = 'block';
}

function hasSig() {
  if (!sigInitialized || !sigCtx) return false;
  const canvas = getSigCanvas();
  const imgData = sigCtx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < imgData.length; i += 4) {
    if (imgData[i] > 15) return true;
  }
  return false;
}
